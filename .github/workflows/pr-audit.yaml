name: PR Audit
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - edited

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-audit:
    name: Audit
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PNPM with Dependencies
        uses: ./.github/actions/setup-pnpm-with-dependencies/

      - name: PR Audit
        uses: Kong/public-shared-actions/pr-previews/audit@43112b0f261fbe0ba7551cba05fba936a7532b58
        if: github.actor != 'renovate[bot]'
        with:
          renovate-pr-author: renovate[bot]
