minimumReleaseAgeExclude:
  - '@kong/*'
  - '@kong-ui/*'
  - '@kong-ui-public/*'
overrides:
  fast-uri@<=3.1.0: '>=3.1.2'
  shell-quote@>=1.1.0 <=1.8.3: '>=1.8.4'
  js-cookie@<=3.0.5: '>=3.0.8'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  tmp@<=0.2.3: '>=0.2.7'
  lodash@<=4.17.23: '>=4.18.0'
  lodash-es@<=4.17.23: '>=4.18.0'
  minimatch@<3.1.4: '>=3.1.5'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.9'
  rollup@<2.80.0: '>=4.62.2'
  flatted@<=3.4.1: '>=3.4.2'
  dompurify@<3.3.2: '>=3.4.11'
  picomatch@<2.3.2: '>=2.3.2'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
strictPeerDependencies: false
autoInstallPeers: true
sideEffectsCache: false # Ensure the postinstall script of the lefthook package is executed and hooks are installed'
allowBuilds:
  '@evilmartians/lefthook': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  vue-demi: true
